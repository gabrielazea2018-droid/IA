services:
  # ------------------------------------------------------------------
  # 1) Base de datos: PostgreSQL + PostGIS con los sitios de Bogota
  #    (db/init.sql crea la tabla, el indice GIST y hace el seed)
  # ------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: bogota_pois_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bogota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bogota}
      POSTGRES_DB: ${POSTGRES_DB:-bogota}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ------------------------------------------------------------------
  # 2) Administrador de PostgreSQL: pgAdmin 4 (UI web)
  # ------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bogota_pois_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      # En contenedor siempre corre en modo servidor; sin master password.
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  # ------------------------------------------------------------------
  # 3) Backend: FastAPI + SQLAlchemy/GeoAlchemy2
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bogota_pois_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bogota}:${POSTGRES_PASSWORD:-bogota}@db:5432/${POSTGRES_DB:-bogota}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:8080
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # ------------------------------------------------------------------
  # 4) Frontend: visor React + Leaflet servido con nginx (reverse proxy /api)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bogota_pois_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  pgadmin_data:
